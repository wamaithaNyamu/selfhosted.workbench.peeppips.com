services:
  postgres:
    image: timescale/timescaledb:2.19.1-pg17
    container_name: workbench-postgres
    restart: unless-stopped
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_password}
    expose:
      - "5432"
    volumes:
      - workbench_postgres_data:/var/lib/postgresql/data
    networks:
      - workbench-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: workbench-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - workbench-net

  nginx:
    image: nginx:alpine
    container_name: workbench-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - workbench-net

volumes:
  workbench_postgres_data:

networks:
  workbench-net:
    external: true