# docker-compose.logs.yml

services:
  loki:
    image: grafana/loki:3.2.1
    container_name: workbench-loki
    user: root
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - workbench-net

  promtail:
    image: grafana/promtail:3.2.1
    container_name: workbench-promtail
    user: root
    restart: unless-stopped
   
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_ROOT:-/var/lib/docker}/containers:${DOCKER_ROOT:-/var/lib/docker}/containers:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    networks:
      - workbench-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: workbench-grafana
    user: root
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceQLStreaming metricsSummary
      - GF_PROVISIONING_ALLOW_UI_UPDATES=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./observability/grafana_dashboards_provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./observability/dashboard:/var/lib/grafana/dashboards
    networks:
      - workbench-net

volumes:
  grafana_data:

networks:
  workbench-net:
    external: true