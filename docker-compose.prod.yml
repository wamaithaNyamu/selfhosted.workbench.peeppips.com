services:
  postgres:
    image: ghcr.io/${GHCR_USERNAME}/postgres${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    command: postgres -c listen_addresses='*' -c max_locks_per_transaction=1024
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGCTLTIMEOUT: 600
    volumes:
      - workbench_postgres_data:/var/lib/postgresql/data
    networks:
      - workbench-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - workbench-net

  migrate:
    image: ghcr.io/${GHCR_USERNAME}/migrate${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  mt5-ingest:
    image: ghcr.io/${GHCR_USERNAME}/mt5-ingest${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  deriv-datasource:
    image: ghcr.io/${GHCR_USERNAME}/deriv-datasource${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  go-temporal-worker:
    image: ghcr.io/${GHCR_USERNAME}/go-temporal-workers${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    command: ["/usr/local/bin/worker"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: workbench-temporal
      TEMPORAL_PORT: 7233
      TEMPORAL_TASK_QUEUE: go-workers-task-queue
      MT5_DOCKER_HOST_DATA_ROOT: /home/devuser/backend.workbench.client
      MT5_DOCKER_HOST_WINE_ROOT: /var/lib/workbench/wine
      MT5_WORKER_DATA_ROOT: /mt5
      MT5_WORKER_WINE_ROOT: /wine
      MT5_PYTHON_IMAGE: ghcr.io/${GHCR_USERNAME}/mt5-python-runner${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/devuser/backend.workbench.client:/mt5
      - /var/lib/workbench/wine:/wine
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  go-temporal-api-gateway:
    image: ghcr.io/${GHCR_USERNAME}/go-temporal-workers${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    container_name: workbench-go-temporal-api-gateway
    restart: unless-stopped
    command: ["/usr/local/bin/api-gateway"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: workbench-temporal
      TEMPORAL_PORT: 7233
      TEMPORAL_TASK_QUEUE: go-workers-task-queue
      TEMPORAL_GATEWAY_PORT: 8110
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  python-temporal-worker:
    image: ghcr.io/${GHCR_USERNAME}/python-temporal-workers${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    command: ["python", "/app/run_worker.py"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: workbench-temporal
      TEMPORAL_PORT: 7233
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  python-api-gateway:
    image: ghcr.io/${GHCR_USERNAME}/python-temporal-workers${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    container_name: workbench-python-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: workbench-temporal
      TEMPORAL_PORT: 7233
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  strategy-runner:
    image: ghcr.io/${GHCR_USERNAME}/strategy-runner${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    container_name: workbench-strategy-runner
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workbench-net

  mt5-api:
    image: ghcr.io/${GHCR_USERNAME}/mt5-python-runner${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wine_environment:/home/wineuser/.wine
    environment:
      MT5_API_PORT: 8000
    networks:
      - workbench-net

  server:
    image: ghcr.io/${GHCR_USERNAME}/server${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      mt5-ingest:
        condition: service_started
      deriv-datasource:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/peeppips-workbench:/opt/peeppips-workbench:rw
    networks:
      - workbench-net

  frontend:
    image: ghcr.io/${GHCR_USERNAME}/frontend${IMAGE_SUFFIX:-}:${IMAGE_TAG}
    container_name: workbench-nextjs
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    networks:
      - workbench-net

  caddy-waf:
    image: ghcr.io/coreruleset/coraza-crs:4.25.0-caddy-alpine-lts
    container_name: workbench-caddy-waf
    restart: unless-stopped
    volumes:
      - ./infra/waf/502.html:/etc/caddy/errors/502.html:ro
      - ./infra/waf/Caddyfile:/custom-Caddyfile:ro
      - ./infra/waf/overrides:/opt/coraza/overrides:ro
    command: caddy run --config /custom-Caddyfile --adapter caddyfile
    depends_on:
      - server
      - mt5-ingest
      - deriv-datasource
    networks:
      - workbench-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: workbench-cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
      - caddy-waf
    networks:
      - workbench-net


volumes:
  workbench_postgres_data:
  wine_environment:

networks:
  workbench-net:
    external: true
