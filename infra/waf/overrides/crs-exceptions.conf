# Bypass OS File Access Attempt (930120) globally due to false positives
# The JSON payload contains a "credentials" object which triggers the rule because it matches ".credentials"
SecRuleRemoveById 930120

# Bypass Method Enforcement (911100) to allow REST API methods like DELETE, PUT, PATCH
SecRuleRemoveById 911100

# Bypass Host header is a numeric IP address (920350) to allow Tailscale IP access
SecRuleRemoveById 920350
