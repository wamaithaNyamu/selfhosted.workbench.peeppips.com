# observability/prometheus.yml

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["workbench-prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["workbench-cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["workbench-node-exporter:9100"]

  - job_name: tempo-metrics
    static_configs:
      - targets: ["workbench-tempo:3200"]